[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flakewatch"
version = "0.1.0"
description = "Find flaky tests across CI runs from JUnit XML and classify their probable root cause (Selenium-aware)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "baggy2797" }]
keywords = ["flaky-tests", "junit", "selenium", "ci", "test-automation", "quarantine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6,<3",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-defusedxml",
  "build",
]

[project.scripts]
flakewatch = "flakewatch.cli:app"

[project.urls]
Homepage = "https://github.com/baggy2797/flakewatch"

[tool.hatch.build.targets.wheel]
packages = ["src/flakewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=flakewatch --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["flakewatch"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "C408"]
"benchmarks/*" = ["S311"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "benchmarks"]
